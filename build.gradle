import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id('idea')
	id('maven-publish')
	id 'net.neoforged.moddev' version '2.0.140'
	// todo replace with mc-publish, as these plugins do not support Gradle configuration cache
	id('com.modrinth.minotaur') version '2.+'
	id('com.matthewprenger.cursegradle') version '1.4.0'
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

group = 'thedarkcolour.forestry'
version = forestryVersion
base.archivesName = "forestry-$minecraftVersion"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.toolchain.vendor = JvmVendorSpec.JETBRAINS

// The jars of D1, one source set each. sourceSets.main IS the core jar: Gradle's jar task,
// processResources, components.java and the access transformers all attach to main by convention,
// and core is the artifact those conventions should describe. The rest sit at src/<name>/java.
//
// This is the point at which the dependency graph stops being a convention checked by a gradle task
// and becomes a compile error. checkBaseBoundary and checkBaseBytecode were standing in for the
// compiler since phase 2; from here the compiler does it, and it sees descriptors, generics and
// inline fully-qualified references that an import scan never could.
//
// 9a still produces one jar and one mod id. Splitting the artifacts is 9b.
//
// datagen is a source set but not a jar, from phase 8. The providers are the only thing in the repo
// that touches ModKit, a dev-only dependency: with them in main, every datagen lambda put a ModKit
// type into a method descriptor that FML's boot-time annotation scanner then tried to resolve from
// the shipped jar. Keeping them out of main removes the cause rather than filtering the symptom out
// of the jar.
var contentModules = ['butterflies', 'farms', 'mail']

// Source set name to Java package name. The two diverge because the jars were renamed and the
// packages were not, and both halves of checkJarPartition assumed they were the same string
var contentPackages = [butterflies: 'lepidopterology', farms: 'agriculture', mail: 'mail']

// A wrong entry here disables rather than fails the base-jar leak check in checkJarPartition: it
// scans for a package that does not exist, finds nothing and reports a clean jar. Assert the
// packages are real at configuration time, where the failure is still loud
contentModules.each { m ->
	var pkg = contentPackages[m]
	if (pkg == null || !project.file("src/${m}/java/forestry/${pkg}").isDirectory()) {
		throw new GradleException("contentPackages[${m}] must name a directory under src/${m}/java/forestry, got: ${pkg}")
	}
}

sourceSets {
	butterflies
	farms
	mail
	datagen
}

// Everything requires core, and nothing else. Arboriculture moving into core dissolved the only
// cross-content edge the split ever had - three TreeUtil imports for butterfly pollination
sourceSets.butterflies.compileClasspath += sourceSets.main.output
sourceSets.farms.compileClasspath += sourceSets.main.output
sourceSets.mail.compileClasspath += sourceSets.main.output

contentModules.each { m ->
	sourceSets[m].runtimeClasspath += sourceSets.main.output
	configurations["${m}Implementation"].extendsFrom configurations.implementation
	configurations["${m}CompileOnly"].extendsFrom configurations.compileOnly
}

// Datagen and the GameTests both read every jar, so they get them all
sourceSets.datagen.compileClasspath += sourceSets.main.output
sourceSets.datagen.runtimeClasspath += sourceSets.main.output
contentModules.each { m ->
	sourceSets.datagen.compileClasspath += sourceSets[m].output
	sourceSets.datagen.runtimeClasspath += sourceSets[m].output
}

// ---- Per-jar resource ownership (phase 9b) ----
//
// Which jar ships which resource. Two checked-in files drive this and both are generated:
//
//   src/generated/ownership.json        registry id -> jar. Written by datagen from the live feature
//                                       registries, so it cannot drift from what the code registers.
//   src/generated/resource-owners.json  resource path -> jar. Written by generateResourceOwners from
//                                       the file above plus the rules below.
//
// Materialising the second one rather than recomputing it per build makes the partition reviewable:
// a file changing jars shows up as a diff instead of as silent behaviour.
//
// Unmatched files fall to core. That is the safe direction - core is always installed, so an
// unmatched resource still reaches the player - but it is reported, not silent.
var ownershipFile = project.file('src/generated/ownership.json')
var resourceOwnersFile = project.file('src/generated/resource-owners.json')
var resourceRoots = [project.file('src/generated/resources'), project.file('src/main/resources')]

// Files the game merges across packs rather than resolving from one. Their unit of ownership is the
// entry, not the file, so they are split by partitionSharedResources instead of assigned to a jar.
var entryKeyed = { String path ->
	return path.contains('/tags/') || path.startsWith('data/neoforge/data_maps/') || path.startsWith('data/neoforge/loot_modifiers/')
}

// Folders whose contents belong to one jar regardless of file name
// Loot sub-tables are named after the module that contributes them:
// data/forestry/loot_table/chests/<chest>/<module>.json. They resolve by file name today only
// because a feature happens to share the name 'apiculture'; naming this explicitly means a feature
// rename cannot silently move an apiculture loot table into the core jar, where it would reference
// items a core-only install does not have and fail the datapack load
var lootModuleJars = [
		'apiculture'     : 'core',
		'arboriculture'  : 'core',
		'lepidopterology': 'butterflies',
		'farming'        : 'farms',
		'cultivation'    : 'farms',
		'mail'           : 'mail',
		'factory'        : 'core',
		'storage'        : 'core',
		'energy'         : 'core',
		'sorting'        : 'core',
		'worktable'      : 'core',
		'core'           : 'core',
]

// Worldgen features are named after what they generate, not after a registered feature, so they do
// not resolve through the ownership map. A configured/placed feature shipped by the wrong jar is an
// unbound registry value and fails world load, so these are named explicitly
var worldgenOwners = [
		'hive': 'core',
		'tree': 'core',
]

var folderOwners = [
		'data/forestry/bee_species/'              : 'core',
		'data/forestry/bee_effect/'               : 'core',
		'data/forestry/recipe/bee_mutation/'      : 'core',
		'data/forestry/tree_species/'             : 'core',
		'data/forestry/recipe/tree_mutation/'     : 'core',
		'data/forestry/butterfly_species/'        : 'butterflies',
		// A chest loot modifier hooks a vanilla table and names its contributing modules as plain
		// strings, resolving each sub-table at run time and skipping the ones that are absent. So it
		// belongs to base whatever it names. Without this, nether_bridge.json resolves by longest
		// prefix to the farms feature 'forestry:nether' and any install lacking the farms jar
		// silently loses its nether fortress bee loot
		'data/forestry/loot_modifiers/chests/'    : 'core',
		// A mutation recipe's karyotype resolves through the genetic manager, which throws rather than
		// returning null for an unregistered species type. RecipeManager does not catch that, so one
		// butterfly mutation left in core takes the whole server down
		'data/forestry/recipe/butterfly_mutation/': 'butterflies',
]

tasks.register('generateResourceOwners') {
	group = 'build'
	description = 'Materialises the resource path to jar mapping the jar tasks ship from'

	outputs.upToDateWhen { false }

	doLast {
		if (!ownershipFile.exists()) {
			throw new GradleException("${ownershipFile} is missing. Run ./gradlew runData first.")
		}
		var idOwners = new JsonSlurper().parse(ownershipFile) as Map<String, String>

		// Longest-prefix match on the file name. Generated variants are named after their parent -
		// birch_door_open, spruce_fence_side - so walking the name back by underscore finds the owner
		// without enumerating every suffix Minecraft's model generators emit
		var ownerOfName = { String base ->
			var parts = base.split('_')
			for (int n = parts.length; n > 0; n--) {
				var owner = idOwners['forestry:' + parts[0..<n].join('_')]
				if (owner != null) {
					return owner
				}
			}
			return null
		}

		var owners = new TreeMap<String, String>()
		var pending = new ArrayList<List<String>>()

		resourceRoots.each { File root ->
			if (!root.exists()) {
				return
			}
			root.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
				var rel = root.toPath().relativize(file.toPath()).toString()
				if (rel.startsWith('.cache/')) {
					return
				}
				if (rel.startsWith('data/forestry/worldgen/') && rel.endsWith('.json')) {
					var feature = rel.substring(rel.lastIndexOf('/') + 1, rel.length() - 5)
					var worldgenJar = worldgenOwners[feature]
					if (worldgenJar != null) {
						owners[rel] = worldgenJar
						return
					}
				}
				if (rel.startsWith('data/forestry/loot_table/chests/') && rel.endsWith('.json')) {
					var module = rel.substring(rel.lastIndexOf('/') + 1, rel.length() - 5)
					var lootJar = lootModuleJars[module]
					if (lootJar != null) {
						owners[rel] = lootJar
						return
					}
				}
				var folder = folderOwners.find { rel.startsWith(it.key) }
				if (folder != null) {
					owners[rel] = folder.value
					return
				}
				if (rel.endsWith('.json')) {
					// Exact name first. Longest-prefix runs later, after the tag rule, because it is
					// greedy enough to be wrong on its own: forestry:chestnut is a core fruit, so
					// chestnut_logs would resolve to core and strand arboriculture's log tag there
					var base = rel.substring(rel.lastIndexOf('/') + 1, rel.length() - 5)
					var exact = idOwners['forestry:' + base]
					if (exact != null) {
						owners[rel] = exact
						return
					}
				}
				pending.add([root.path, rel])
			}
		}

		// A tag whose forestry entries all belong to one jar belongs to that jar. This matters for
		// correctness rather than tidiness: a tag shipped in core that lists an item from an absent
		// jar fails datapack load, which is the exact failure the drop_honey tag had before phase 4
		var mixedTags = new ArrayList<String>()
		def stillPending = new ArrayList<List<String>>()
		pending.each { entry ->
			var rel = entry[1]
			if (!rel.contains('/tags/') || !rel.endsWith('.json')) {
				stillPending.add(entry)
				return
			}
			var parsed
			try {
				parsed = new JsonSlurper().parse(new File(entry[0], rel))
			} catch (ignored) {
				stillPending.add(entry)
				return
			}
			var tagOwners = new HashSet<String>()
			(parsed['values'] ?: []).each { value ->
				var id = value instanceof String ? value : value['id']
				// A leading # is a reference to another tag rather than to a block or item. Those are
				// deliberately not followed: see the known-open note in the reorg spec
				if (id instanceof String && id.startsWith('forestry:')) {
					var owner = ownerOfName(id.substring('forestry:'.length()))
					if (owner != null) {
						tagOwners.add(owner)
					}
				}
			}
			var content = tagOwners - 'core'
			if (content.size() == 1) {
				owners[rel] = content.first()
			} else {
				if (content.size() > 1) {
					mixedTags.add(rel)
				}
				stillPending.add(entry)
			}
		}

		// A recipe belongs to whoever owns what it produces. Machine recipes are nested by machine and
		// named after the variant - recipe/fabricator/fireproof/planks/palm.json - so the file name
		// says nothing about the owner, but the result does. Without this those recipes ship in core
		// and a core-only install logs a parse error per recipe for an item it does not have
		var afterResults = new ArrayList<List<String>>()
		stillPending.each { entry ->
			var rel = entry[1]
			if (rel.startsWith('data/forestry/recipe/') && rel.endsWith('.json')) {
				var parsed
				try {
					parsed = new JsonSlurper().parse(new File(entry[0], rel))
				} catch (ignored) {
					parsed = null
				}
				// Machine recipes nest the vanilla shape under their own: fabricator puts it under
				// "recipe", so the result is not always at the top level
				var findResult
				findResult = { node ->
					if (!(node instanceof Map)) {
						return null
					}
					var direct = node['result']
					if (direct != null) {
						return direct instanceof Map ? (direct['id'] ?: direct['item']) : direct
					}
					for (child in node.values()) {
						var found = findResult(child)
						if (found != null) {
							return found
						}
					}
					return null
				}
				var resultId = findResult(parsed)
				// Exact, never longest-prefix: a result is a real registry id, and prefix matching
				// would resolve papaya_fireproof_wood to the core fruit forestry:papaya
				if (resultId instanceof String) {
					var owner = idOwners[resultId]
					if (owner != null) {
						owners[rel] = owner
						return
					}
				}
			}
			afterResults.add(entry)
		}
		stillPending = afterResults

		// Longest-prefix, now that tags have had their say. Generated model variants are named after
		// their parent - birch_door_open, spruce_fence_side - so walking the name back by underscore
		// finds the owner without enumerating every suffix Minecraft's model generators emit
		var afterPrefix = new ArrayList<List<String>>()
		stillPending.each { entry ->
			var rel = entry[1]
			if (rel.endsWith('.json')) {
				var base = rel.substring(rel.lastIndexOf('/') + 1, rel.length() - 5)
				var owner = ownerOfName(base)
				if (owner != null) {
					owners[rel] = owner
					return
				}
			}
			afterPrefix.add(entry)
		}
		stillPending = afterPrefix

		// A texture belongs to whichever jar ships the models that reference it
		var textureOwners = new HashMap<String, Set<String>>()
		owners.each { rel, owner ->
			if (!rel.startsWith('assets/forestry/models') || !rel.endsWith('.json')) {
				return
			}
			var file = resourceRoots.collect { new File(it, rel) }.find { it.exists() }
			if (file == null) {
				return
			}
			var parsed
			try {
				parsed = new JsonSlurper().parse(file)
			} catch (ignored) {
				return
			}
			(parsed['textures'] ?: [:]).each { key, value ->
				if (value instanceof String && value.startsWith('forestry:')) {
					textureOwners.computeIfAbsent(value.substring('forestry:'.length()), { new HashSet<String>() }).add(owner)
				}
			}
		}

		var fellBack = 0
		stillPending.each { entry ->
			var rel = entry[1]
			if (rel.startsWith('assets/forestry/textures/') && rel.endsWith('.png')) {
				var key = rel.substring('assets/forestry/textures/'.length(), rel.length() - 4)
				var candidates = textureOwners[key]
				if (candidates != null && candidates.size() == 1) {
					owners[rel] = candidates.first()
					return
				}
			}
			owners[rel] = 'core'
			fellBack++
		}

		// ---- Reference closure ----
		//
		// Every rule above answers "what is this file about". Correctness turns on a different
		// question: "what can this file see". A fabricator recipe whose result is a core item but
		// whose ingredient is an arboriculture log is about core and belongs to arboriculture. Each
		// rule picks one signal and ignores the rest, so each is locally plausible and globally wrong.
		//
		// A jar may ship a file only if every forestry id the file names is present wherever that jar
		// is. Promote each file to the least derived jar that satisfies that - least derived because
		// core reaches the most installs - and report the ones no jar can satisfy.
		var visibility = [
				'core'       : ['core'] as Set,
				'butterflies': ['core', 'butterflies'] as Set,
				'farms'      : ['core', 'farms'] as Set,
				'mail'       : ['core', 'mail'] as Set,
		]

		// Species ids are not features, so the ownership manifest does not carry them. Their definition
		// files are partitioned by folder already and the file name is the id
		var speciesOwners = new HashMap<String, String>()
		owners.each { rel, owner ->
			var m = rel =~ '^data/forestry/(?:bee|tree|butterfly)_species/(.+)\\.json$'
			if (m.matches()) {
				speciesOwners['forestry:' + m[0][1]] = owner
			}
		}
		// The species *type* ids too, so that a taxon - which names its type and nothing else that is
		// owned - lands in the jar that defines the type. The folder rules above already say which jar
		// that is, so this reads it back rather than repeating it
		folderOwners.each { folder, jar ->
			var m = folder =~ '^data/forestry/(\\w+_species)/$'
			if (m.matches()) {
				speciesOwners['forestry:' + m[0][1]] = jar
			}
		}

		// A "#forestry:x" entry resolves to whichever jar ships the file defining tag x. The registry
		// folder is the one the referencing file sits in, so the path is constructible
		var tagFileOwner = { String registryFolder, String path ->
			return owners['data/forestry/tags/' + registryFolder + '/' + path + '.json']
		}

		// Inside a tag the folder names the registry, which settles the ids that two registries share.
		// Ex. forestry:escritoire is a core block and an apiculture point of interest, so the bare id
		// answers one of them wrong; the qualified key answers both. The registry is some prefix of the
		// folder - 'block' of 'block/mineable', but all of 'worldgen/biome' - so every prefix is tried
		var qualifiedOwner = { String registryFolder, String id ->
			if (registryFolder == null) {
				return null
			}
			var parts = registryFolder.split('/')
			for (int n = 1; n <= parts.length; n++) {
				var owner = idOwners[parts[0..<n].join('/') + '/' + id]
				if (owner != null) {
					return owner
				}
			}
			return null
		}

		// The json key in front of a reference decides whether it is load bearing. An absent item is an
		// unknown registry key and fails the file that names it; an absent *tag* just resolves empty,
		// which is how a recipe degrades gracefully when a jar is missing. So "tag" references place no
		// constraint on ownership and everything else does. Ingredient alternatives and tag values are
		// bare array elements with no key in front, and those are load bearing
		var refPattern = ~/(?:"(\w+)"\s*:\s*)?"(#?)forestry:([a-z0-9_.\/-]+)"/
		var promotions = new TreeMap<String, String>()
		var unsatisfiable = new TreeMap<String, Set<String>>()
		var split = new TreeSet<String>()

		owners.each { rel, owner ->
			if (!rel.endsWith('.json')) {
				return
			}
			// The Patchouli book is one document that names every module's content. Splitting it is an
			// open question the reorg spec defers, so it is exempt and ships whole in core
			if (rel.startsWith('assets/forestry/patchouli_books/')) {
				return
			}
			var file = resourceRoots.collect { new File(it, rel) }.find { it.exists() }
			if (file == null) {
				return
			}
			var registryFolder = (rel =~ '^data/[^/]+/tags/(.+)/[^/]+\\.json$').with { it.find() ? it.group(1) : null }
			var needed = new TreeSet<String>()
			// Same references, core included. `needed` drops core because a derived jar always sees it,
			// but deciding whether an entry-keyed file spans jars has to count core as a jar like any
			// other
			var namedJars = new TreeSet<String>()
			file.text.findAll(refPattern) { match, key, hash, path ->
				if (key == 'tag') {
					return
				}
				var found = null
				if (hash) {
					if (registryFolder != null) {
						found = tagFileOwner(registryFolder, path)
					}
				} else {
					found = qualifiedOwner(registryFolder, 'forestry:' + path) ?: idOwners['forestry:' + path] ?: speciesOwners['forestry:' + path]
				}
				if (found != null) {
					namedJars.add(found)
					if (found != 'core') {
						needed.add(found)
					}
				}
			}
			// An entry-keyed collection splits as soon as its entries span jars at all, even when one
			// jar can see every entry. That jar shipping the file whole strands every entry the others
			// own. Ex. genetic_samples names a core propolis and a butterfly caterpillar: the butterfly
			// jar sees both, so the closure below is satisfied and would leave the file there, and a
			// core-only install then has no genetic_samples tag and a propolis that is not in it
			if (entryKeyed(rel) && namedJars.size() > 1) {
				split.add(rel)
				return
			}
			if (needed.isEmpty() || visibility[owner].containsAll(needed)) {
				return
			}
			// A tag, a data map and the global loot modifier list are entry-keyed collections that the
			// game merges across packs, so promoting one is never right: moving the whole file to the
			// jar that owns one entry strands every other entry. The global loot modifier list is the
			// sharpest case - it names the arboriculture grafter, and promoting it to arboriculture
			// would leave a core-only install with no loot modifier list at all. Split those instead:
			// each jar ships a variant holding only its own entries and the game reassembles them
			if (entryKeyed(rel)) {
				split.add(rel)
				return
			}
			var capable = visibility.findAll { it.value.containsAll(needed) }
			if (capable.isEmpty()) {
				unsatisfiable[rel] = needed
			} else {
				promotions[rel] = capable.min { it.value.size() }.key
			}
		}
		promotions.each { rel, jar -> owners[rel] = jar }
		split.each { rel -> owners[rel] = 'split' }

		// Only the taxa naming a species type are placed by the closure above, and those are the genera
		// at the bottom of the tree. Everything above them is a plain taxonomy node that names its
		// parent and nothing owned, so ownership propagates upward: a family belongs to its childrens'
		// jar. A rank whose children disagree - the class above both bees and butterflies - is left in
		// core, which is right, because no one jar can hold it and an unreferenced taxon is inert.
		// Repeated to a fixpoint since each pass resolves one rank
		// A genus at the bottom of the tree names no species type, so the closure cannot place it. What
		// places it is the species definitions that name it as their genus, and those are partitioned
		// by folder already
		var genusClaims = new HashMap<String, Set<String>>()
		owners.each { rel, owner ->
			if (!(rel =~ '^data/forestry/(?:bee|tree|butterfly)_species/')) {
				return
			}
			var file = resourceRoots.collect { new File(it, rel) }.find { it.exists() }
			if (file == null) {
				return
			}
			var genus = new JsonSlurper().parse(file)['genus']
			if (genus instanceof String) {
				genusClaims.computeIfAbsent('data/forestry/taxon/' + genus + '.json', { new HashSet<String>() }).add(owner)
			}
		}
		genusClaims.each { rel, jars ->
			if (jars.size() == 1 && owners[rel] == 'core') {
				owners[rel] = jars.first()
			}
		}

		var taxonChildren = new HashMap<String, List<String>>()
		owners.keySet().findAll { it.startsWith('data/forestry/taxon/') }.each { rel ->
			var file = resourceRoots.collect { new File(it, rel) }.find { it.exists() }
			if (file == null) {
				return
			}
			var parent = new JsonSlurper().parse(file)['parent']
			if (parent instanceof String) {
				taxonChildren.computeIfAbsent('data/forestry/taxon/' + parent + '.json', { new ArrayList<String>() }).add(rel)
			}
		}
		var taxonMoves = 0
		for (int pass = 0; pass < 16; pass++) {
			var moved = 0
			taxonChildren.each { parent, children ->
				if (owners[parent] != 'core') {
					return
				}
				var jars = children.collect { owners[it] } as Set
				// An unresolved child could still land anywhere, so waiting for it is what keeps a
				// parent out of a jar that one of its other children cannot see
				if (jars.size() == 1 && !jars.contains('core')) {
					owners[parent] = jars.first()
					moved++
				}
			}
			taxonMoves += moved
			if (moved == 0) {
				break
			}
		}

		// A .mcmeta is not a file in its own right, it is metadata on the one whose name it extends, and
		// the game reads it from the pack that supplied that file. Shipped from anywhere else it is
		// ignored, so it follows its file rather than being placed. Last, because every rule above can
		// still move the file it annotates
		var followed = 0
		owners.keySet().findAll { it.endsWith('.mcmeta') }.each { rel ->
			var owner = owners[rel.substring(0, rel.length() - '.mcmeta'.length())]
			if (owner != null && owner != owners[rel]) {
				owners[rel] = owner
				followed++
			}
		}

		resourceOwnersFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(owners)) + '\n'

		var counts = new TreeMap<String, Integer>()
		owners.values().each { counts.merge(it, 1, Integer::sum) }
		logger.lifecycle("generateResourceOwners: " + counts.collect { "${it.key}=${it.value}" }.join(', '))
		logger.lifecycle("  ${fellBack} file(s) fell back to core; ${promotions.size()} promoted by reference; ${taxonMoves} taxa followed a parent; ${followed} .mcmeta followed its file; ${split.size()} split by entry")
		promotions.groupBy { it.value }.sort().each { jar, files ->
			logger.lifecycle("  promoted to ${jar}: ${files.size()} file(s)")
		}
		split.each { logger.lifecycle("  split by entry: ${it}") }

		// A file naming content that no single jar can see is not a mapping problem, so there is no
		// assignment that fixes it. It needs a load condition or an entry split, and it is worth
		// failing the build over: shipping it anywhere means a parse error in some install
		if (!unsatisfiable.isEmpty()) {
			var detail = unsatisfiable.collect { rel, needed -> "  ${rel} names ${needed.join(' + ')}" }.join('\n')
			throw new GradleException("File(s) name content no single jar can see:\n${detail}")
		}
	}
}

// Every jar ships only the resources the ownership map assigns to it. Unmapped paths - the mod
// metadata, the access transformer, pack.mcmeta, the logo - fall to core, which is always installed.
var resourceOwnerOf = { String path ->
	if (!resourceOwnersFile.exists()) {
		return 'core'
	}
	return (project.ext.has('resourceOwnerMap')
			? project.ext.resourceOwnerMap
			: (project.ext.resourceOwnerMap = new JsonSlurper().parse(resourceOwnersFile) as Map<String, String>))
			.getOrDefault(path, 'core')
}

// Resolves a forestry id to its jar exactly the way generateResourceOwners does - exact match first,
// then walking the name back by underscore. Shared so the map and the split cannot disagree.
var idOwnerOf = { String id ->
	if (!id.startsWith('forestry:')) {
		return null
	}
	var idOwners = project.ext.has('idOwnerMap')
			? project.ext.idOwnerMap
			: (project.ext.idOwnerMap = (ownershipFile.exists() ? new JsonSlurper().parse(ownershipFile) : [:]) as Map<String, String>)
	var parts = id.substring('forestry:'.length()).split('_')
	for (int n = parts.length; n > 0; n--) {
		var owner = idOwners['forestry:' + parts[0..<n].join('_')]
		if (owner != null) {
			return owner
		}
	}
	return null
}

// The same id qualified by the registry that holds it. Two registries can share a bare id without
// sharing a jar, and only the qualified key answers both of them right.
var qualifiedIdOwnerOf = { String registryFolder, String id ->
	if (registryFolder == null || !id.startsWith('forestry:')) {
		return null
	}
	var idOwners = project.ext.has('idOwnerMap')
			? project.ext.idOwnerMap
			: (project.ext.idOwnerMap = (ownershipFile.exists() ? new JsonSlurper().parse(ownershipFile) : [:]) as Map<String, String>)
	var parts = registryFolder.split('/')
	for (int n = 1; n <= parts.length; n++) {
		var owner = idOwners[parts[0..<n].join('/') + '/' + id]
		if (owner != null) {
			return owner
		}
	}
	return null
}

var partitionDir = project.layout.buildDirectory.dir('generated/sources/resourcePartition')

// Tags, neoforge data maps and the global loot modifier list are assembled by the game from every
// pack that supplies one, so their unit of ownership is the entry rather than the file. Assigning one
// to a jar strands every entry belonging to the others - which is what put an arboriculture log tag
// reference in a core-only install and failed the datapack load. Each jar gets a variant holding only
// its own entries, and the game puts them back together.
var partitionSharedResources = tasks.register('partitionSharedResources') {
	group = 'build'
	description = 'Writes the per-jar variants of the resources the game merges across packs'

	// The merged lang is an input as well as a dependency, so that re-merging re-splits
	inputs.files(generateEnUsLang)
	inputs.file(resourceOwnersFile)
	inputs.file(ownershipFile)
	inputs.files(resourceRoots)
	outputs.dir(partitionDir)

	doLast {
		var fileOwners = new JsonSlurper().parse(resourceOwnersFile) as Map<String, String>
		var outDir = partitionDir.get().asFile
		outDir.deleteDir()

		// A tag entry may name another tag, and that reference belongs to whichever jar defines the
		// tag it names. The registry folder is the one the referencing file sits in, so the path of
		// the defining file is constructible rather than guessed
		var ownerOfEntry = { String rel, String id ->
			if (id.startsWith('#')) {
				var folder = (rel =~ '^data/[^/]+/tags/(.+)/[^/]+\\.json$').with { it.find() ? it.group(1) : null }
				if (folder != null && id.startsWith('#forestry:')) {
					var owner = fileOwners['data/forestry/tags/' + folder + '/' + id.substring('#forestry:'.length()) + '.json']
					if (owner != null && owner != 'split') {
						return owner
					}
				}
				return 'core'
			}
			if (rel.startsWith('data/neoforge/loot_modifiers/') && id.startsWith('forestry:')) {
				// The list names loot modifiers, so an entry belongs wherever its modifier ships
				return fileOwners['data/forestry/loot_modifiers/' + id.substring('forestry:'.length()) + '.json'] ?: 'core'
			}
			// A tag's folder names the registry, which settles the ids two registries share
			var folder = (rel =~ '^data/[^/]+/tags/(.+)/[^/]+\\.json$').with { it.find() ? it.group(1) : null }
			return qualifiedIdOwnerOf(folder, id) ?: idOwnerOf(id) ?: 'core'
		}

		var written = new TreeMap<String, List<String>>()
		fileOwners.findAll { it.value == 'split' }.each { rel, ignored ->
			var file = resourceRoots.collect { new File(it, rel) }.find { it.exists() }
			if (file == null) {
				throw new GradleException("${rel} is marked split but no source file exists")
			}
			var parsed = new JsonSlurper().parse(file)
			// "values" covers tags and data maps; the global loot modifier list calls it "entries"
			var key = parsed.containsKey('entries') ? 'entries' : 'values'
			var entries = parsed[key]
			var perJar = new TreeMap<String, Object>()

			if (entries instanceof Map) {
				entries.each { id, value ->
					perJar.computeIfAbsent(ownerOfEntry(rel, id as String), { new LinkedHashMap<>() })[id] = value
				}
			} else {
				(entries ?: []).each { value ->
					var id = value instanceof String ? value : value['id']
					perJar.computeIfAbsent(ownerOfEntry(rel, id as String), { new ArrayList<>() }).add(value)
				}
			}

			perJar.each { jar, jarEntries ->
				var copy = new LinkedHashMap(parsed)
				copy[key] = jarEntries
				var target = new File(new File(outDir, jar), rel)
				target.parentFile.mkdirs()
				target.text = JsonOutput.prettyPrint(JsonOutput.toJson(copy)) + '\n'
				written.computeIfAbsent(rel, { new ArrayList<String>() }).add("${jar}:${jarEntries.size()}")
			}
		}

		// en_us is a flat map of key to string, and the game merges lang across packs the same way it
		// merges tags. A key generated for a registered thing carries its id - block.forestry.<id> - so
		// it partitions on the same manifest; everything else (gui strings, errors, death messages,
		// allele names) names nothing owned and stays in core. The other ten locales are hand-authored
		// monoliths with no per-key metadata and ship whole in core, per the spec's Deferred section
		var langRegistries = ['block': 'block', 'item': 'item', 'entity': 'entity_type', 'fluid_type': 'fluid_type', 'menu': 'menu']
		var mergedLang = project.file('build/generated/sources/mergedAssets/assets/forestry/lang/en_us.json')
		if (mergedLang.exists()) {
			var perJar = new TreeMap<String, Map<String, Object>>()
			new JsonSlurper().parse(mergedLang).each { key, value ->
				var jar = 'core'
				var parts = key.split('\\.')
				if (parts.length >= 3 && parts[1] == 'forestry' && langRegistries.containsKey(parts[0])) {
					var id = 'forestry:' + parts[2..-1].join('.')
					jar = qualifiedIdOwnerOf(langRegistries[parts[0]], id) ?: idOwnerOf(id) ?: 'core'
				}
				perJar.computeIfAbsent(jar, { new LinkedHashMap<String, Object>() })[key] = value
			}
			perJar.each { jar, keys ->
				var target = new File(new File(outDir, jar), 'assets/forestry/lang/en_us.json')
				target.parentFile.mkdirs()
				target.text = JsonOutput.prettyPrint(JsonOutput.toJson(keys)) + '\n'
			}
			logger.lifecycle("  split assets/forestry/lang/en_us.json -> " + perJar.collect { "${it.key}:${it.value.size()}" }.join(', '))
		}

		written.each { rel, parts -> logger.lifecycle("  split ${rel} -> ${parts.join(', ')}") }
	}
}

configurations {
	// ModKit, isolated so it can reach exactly two places and no others: datagen's compile classpath,
	// and the dev runs' runtime classpath. It must go on main's *runtime* classpath rather than an
	// MDG additionalRuntimeClasspath, because the latter loads outside the game layer and ModKit
	// extends net.minecraft.data.tags.TagsProvider. runtimeOnly keeps it off main's compile
	// classpath, which is the whole point, and the published POM strips dependencies anyway
	modkit
	runtimeOnly.extendsFrom modkit
	datagenCompileOnly.extendsFrom modkit
	// Curios, KubeJS and the rest of the optional-mod surface
	datagenImplementation.extendsFrom implementation
	datagenCompileOnly.extendsFrom compileOnly
}

neoForge {
	version = "$forgeVersion"

	accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
	validateAccessTransformers = true

	// Add Parchment parameter mappings
	parchment {
		mappingsVersion = project.mappingsVersion
		minecraftVersion = project.minecraftVersion
	}

	mods {
		// One mod id per jar. A jar loads as a mod only if it carries neoforge.mods.toml, so this
		// is what makes a content jar optional: leave it out and its plugin is simply not on the
		// service path. Registering forestry: names from a mod whose id is forestry_farms is
		// unrestricted - NeoForge 21.1.230 has no alternative-prefix check.
		forestry {
			sourceSet sourceSets.main
			// Datagen lives in src/datagen (forestry.core.data). Part of the mod so the data run's
			// GatherDataEvent subscriber is discovered, and out of the jars for the same reason as test.
			sourceSet sourceSets.datagen
		}
		contentModules.each { m ->
			create("forestry_${m}") { sourceSet sourceSets[m] }
		}
		// The GameTest suite spans every jar, so it is its own mod id rather than part of core. That
		// is what lets the partial-install boot configurations leave it out: NeoForge's gametest
		// scanner resolves every @GameTest method descriptor at registration, and a test naming a
		// farms type crashes a core-only boot outright - the D3 safety condition, exactly
		create('forestry_gametest') { sourceSet sourceSets.test }
	}

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			jvmArgument '-XX:+AllowEnhancedClassRedefinition'
			jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
			// Every dev run loads sourceSets.datagen as part of the forestry mod, and FML's
			// AutomaticEventSubscriber resolves Data's method signatures at construction, so ModKit
			// has to be on the runtime classpath of all of them - not just runData. See the modkit
			// configuration above; it rides in on main's runtimeClasspath
		}

		client {
			client()
		}

		server {
			server()
			gameDirectory.set(project.layout.projectDirectory.dir('run/server'))
			programArgument '--nogui'
		}

		data {
			data()
			// The data run's working directory is run/, so the ownership manifest needs an absolute
			// destination. It lives beside src/generated/resources rather than inside it, so that it
			// never ships, and it is checked in because the jar tasks read it without running the game
			systemProperty 'forestry.ownershipManifest', file('src/generated/ownership.json').absolutePath
			programArguments.addAll('--mod', 'forestry', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath)
		}

		// Boot configurations for D4: a pack may install base plus any subset of the content jars.
		// These are the only end-to-end proof that the split delivers what it promised, so each one
		// is a real server boot with a real datapack load rather than a classpath assertion.
		//
		// Each takes its own port. A server run does not stop on its own, so killing the gradle task
		// leaves the forked JVM holding the default port, and the next configuration then fails to bind
		// and stops before loading a single datapack - which reads in the log exactly like the split
		// being broken. Distinct ports mean a survivor can only ever block a rerun of itself.
		coreOnlyServer {
			server()
			gameDirectory.set(project.layout.projectDirectory.dir('run/boot-core'))
			programArguments.addAll('--nogui', '--port', '25566')
			loadedMods = [mods.forestry]
		}

		// Butterflies alone. Bees and trees are core now, so this proves only what it should: that the
		// butterfly jar needs nothing but base
		butterfliesServer {
			server()
			gameDirectory.set(project.layout.projectDirectory.dir('run/boot-butterflies'))
			programArguments.addAll('--nogui', '--port', '25567')
			loadedMods = [mods.forestry, mods.forestry_butterflies]
		}

		// Every jar. The `server` run above loads whatever is on the dev classpath; this one names the
		// published jars, so it is the configuration a player actually installs
		allJarsServer {
			server()
			gameDirectory.set(project.layout.projectDirectory.dir('run/boot-all'))
			programArguments.addAll('--nogui', '--port', '25569')
			loadedMods = [mods.forestry, mods.forestry_butterflies, mods.forestry_farms, mods.forestry_mail]
		}

		// Multiblock inventory-conservation GameTest suite. Runs ONLY via `gradlew runGameTestServer`; the
		// enabled-namespaces property is what makes NeoForge execute the @GameTestHolder("forestry") classes, so the
		// tests are completely inert in normal client/server play.
		gameTestServer {
			type = "gameTestServer"
			gameDirectory.set(project.layout.projectDirectory.dir('run/gametest'))
			systemProperty 'neoforge.enabledGameTestNamespaces', 'forestry'
			// Forwards `-Pforestry.genomeBaseline=generate` to the forked gametest JVM so GenomeBaselineTest
			// can (re)generate its golden-master snapshot. Empty/absent => assert mode.
			systemProperty 'forestry.genomeBaseline', providers.gradleProperty('forestry.genomeBaseline').getOrElse('')
			// Same for CreativeTabBaselineTest, which guards creative tab membership across the
			// phase 2 and phase 7 tab moves. Nothing else sees tab contents.
			systemProperty 'forestry.creativeTabBaseline', providers.gradleProperty('forestry.creativeTabBaseline').getOrElse('')
		}
	}

	// src/test, src/datagen and the content roots have no Minecraft/NeoForge on their classpath by
	// default. Moddev only wires that into source sets it's told about. Without this they won't compile.
	addModdingDependenciesTo sourceSets.test
	addModdingDependenciesTo sourceSets.datagen
	contentModules.each { addModdingDependenciesTo sourceSets[it] }
}

// The test source set holds GameTests (run via runGameTestServer), not JUnit tests, so the standard `test` task
// discovers nothing. Gradle 9 fails the build on no-discovered-tests by default; opt out so `./gradlew build` is green.
tasks.named('test', Test) {
	failOnNoDiscoveredTests = false
}

// Phase 1 of the feature reorg: nothing under forestry.api may import a forestry package
// outside forestry.api. Import-based on purpose. A constant-pool scan misses types that
// appear only in a method descriptor or an erased generic (IHiveManager's
// ImmutableList<VillageHive>), and a plain text scan trips over javadoc that names impl
// classes as {@code ...} prose. The descriptor-aware gate arrives with ArchUnit in phase 9.
var checkApiBoundary = tasks.register('checkApiBoundary') {
	group = 'verification'
	description = 'Fails if forestry.api imports any forestry package outside forestry.api'

	var apiDir = project.file('src/main/java/forestry/api')
	inputs.dir(apiDir)
	outputs.upToDateWhen { false }

	doLast {
		var offenders = new TreeMap<String, List<String>>()

		apiDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
			if (!file.name.endsWith('.java')) {
				return
			}
			var relative = apiDir.toPath().relativize(file.toPath()).toString()
			file.eachLine('UTF-8') { line, number ->
				if (line ==~ /^import (static )?forestry\.(?!api\.).*/) {
					offenders.computeIfAbsent(relative, { [] }).add("line ${number}: ${line.trim()}")
				}
			}
		}

		if (!offenders.isEmpty()) {
			var total = offenders.values().sum { it.size() }
			var report = offenders.collect { name, lines ->
				"  ${name}\n" + lines.collect { "      ${it}" }.join('\n')
			}.join('\n')
			throw new GradleException(
					"forestry.api must not import outside forestry.api.\n" +
					"${offenders.size()} file(s), ${total} import(s):\n${report}")
		}

		logger.lifecycle('checkApiBoundary: forestry.api is clean')
	}
}

tasks.named('check') {
	dependsOn checkApiBoundary
}

// The spec's Verification section asks for this and phase 7b is what makes it necessary: the
// Patchouli book templates, kubejs.plugins.txt and META-INF/services all name Java classes by
// fully qualified name, in hand-authored files that neither the datagen diff nor the GameTests
// can see. A move that forgets one of them fails silently at runtime.
var checkResourceFqcn = tasks.register('checkResourceFqcn') {
	group = 'verification'
	description = 'Fails if a resource file names a forestry class that does not exist'

	// Every source root. The service file names one plugin class per content jar, and those left
	// src/main/java in 9a; a single-root check reports every one of them as missing
	var javaDirs = [project.file('src/main/java'), project.file('src/datagen/java')] +
			contentModules.collect { project.file("src/${it}/java") }
	// Every resource root, including the per-jar ones. The plugin service files moved there in
	// phase 9b, and a single-root scan silently stopped checking the content ones
	var resourceDirs = [project.file('src/main/resources'), project.file('src/generated/resources')] +
			contentModules.collect { project.file("src/${it}/resources") }

	inputs.files(javaDirs)
	outputs.upToDateWhen { false }

	doLast {
		// A dotted run starting at "forestry"; the class is the first segment that starts with an
		// uppercase letter, so lang keys such as "block.forestry.mailbox" never match
		var token = ~/forestry(?:\.[A-Za-z_$][A-Za-z0-9_$]*)+/
		var missing = new TreeSet<String>()
		var seen = new TreeSet<String>()

		var check = { String fqcn, String where ->
			var parts = fqcn.split('\\.')
			var end = -1
			for (int i = 1; i < parts.length; i++) {
				if (Character.isUpperCase(parts[i].charAt(0) as char)) {
					end = i
					break
				}
			}
			if (end < 0) {
				return
			}
			var name = parts[0..end].join('.')
			seen.add(name)
			var relative = name.replace('.', '/') + '.java'
			if (javaDirs.every { !new File(it, relative).exists() }) {
				missing.add("${name} (${where})")
			}
		}

		resourceDirs.each { dir ->
			if (!dir.exists()) {
				return
			}
			dir.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
				// service files name the service in the file name itself
				if (file.parentFile.name == 'services') {
					check(file.name, file.name)
				}
				if (file.length() > 4_000_000) {
					return
				}
				var text
				try {
					text = file.getText('UTF-8')
				} catch (ignored) {
					return
				}
				var m = token.matcher(text)
				while (m.find()) {
					check(m.group(), dir.toPath().relativize(file.toPath()).toString())
				}
			}
		}

		if (!missing.isEmpty()) {
			throw new GradleException(
					"Resource file(s) name a forestry class that does not exist:\n  "
					+ missing.join('\n  ')
					+ "\nA package move must update hand-authored JSON, service files and kubejs.plugins.txt.")
		}
		logger.lifecycle("checkResourceFqcn: ${seen.size()} resource-borne class name(s) all resolve")
	}
}

tasks.named('check') {
	dependsOn checkResourceFqcn
}

// D2 gives core one internal edge to enforce: platform and engine sit below content and must not
// import it. Measured at the start of phase 9a: engine obeys this at 0 files, platform does not, at
// 26 files. No phase has ever gated it. The engine half is gated here; the platform half is printed
// every build so it stays visible rather than becoming folklore. Severing those 26 is its own piece
// of work - it is content relocation, not packaging, and nothing about the jar split depends on it.
var checkCoreLayers = tasks.register('checkCoreLayers') {
	group = 'verification'
	description = 'Fails if forestry.core.engine imports forestry.core.content'

	var coreDir = project.file('src/main/java/forestry/core')

	inputs.dir(coreDir)
	outputs.upToDateWhen { false }

	doLast {
		var pattern = ~/^import (static )?forestry\.core\.content\..*/
		var offendersIn = { String layer ->
			var dir = new File(coreDir, layer)
			var hits = new TreeSet<String>()
			if (dir.exists()) {
				dir.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
					if (file.name.endsWith('.java') && file.readLines('UTF-8').any { it ==~ pattern }) {
						hits.add(coreDir.toPath().relativize(file.toPath()).toString())
					}
				}
			}
			return hits
		}

		var engine = offendersIn('engine')
		if (!engine.isEmpty()) {
			throw new GradleException(
					"forestry.core.engine must not import forestry.core.content:\n  "
					+ engine.join('\n  ')
					+ "\nThe engine layer sits below content. Invert the reference through an api interface.")
		}
		logger.lifecycle("checkCoreLayers: engine is clean; platform has ${offendersIn('platform').size()} "
				+ "file(s) importing content (known, ungated - see D2 in the reorg spec)")
	}
}

tasks.named('check') {
	dependsOn checkCoreLayers
}

repositories {
	maven {
		name = 'jei'
		url = 'https://maven.blamejared.com/'
		content { includeGroup 'mezz.jei' }
	}
	maven {
		name = 'Patchouli'
		url = 'https://maven.blamejared.com/'
	}
	maven {
		name = 'Architectury API'
		url = 'https://maven.architectury.dev'
		content { includeGroup 'dev.architectury' }
	}
	maven {
		name = 'KubeJS and Rhino'
		url = 'https://maven.latvian.dev/releases'
		content { includeGroupAndSubgroups 'dev.latvian' }
	}
	maven {
		name = 'Mekanism'
		url = 'https://modmaven.dev/'
		content { includeGroup 'mekanism' }
	}
	maven {
		name = 'Curios'
		url = 'https://maven.theillusivec4.top/'
		content { includeGroup 'top.theillusivec4.curios' }
	}
	maven {
		name = 'CurseMaven'
		url = 'https://cursemaven.com'
		content { includeGroup 'curse.maven' }
	}
	maven { url = "https://maven.createmod.net" }
	maven {
		name = 'Ponder'
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
	}
	maven {
		name = 'ModKit'
		url = 'https://jitpack.io'
		content {
			includeGroup 'com.github.thedarkcolour'
			includeGroup 'com.github.rtyley'
		}
	}
}

dependencies {
	// JEI OPTIONAL
	compileOnly "mezz.jei:jei-$minecraftVersion-neoforge-api:$jeiVersion"
	runtimeOnly "mezz.jei:jei-$minecraftVersion-neoforge:$jeiVersion"
	// KubeJS OPTIONAL
	implementation "dev.architectury:architectury-neoforge:${architecturyVersion}"
	implementation "dev.latvian.mods:rhino:${rhinoVersion}"
	implementation "dev.latvian.mods:kubejs-neoforge:${kubejsVersion}"
	// Curios Optional
	implementation "top.theillusivec4.curios:curios-neoforge:${curiosVersion}+${minecraftVersion}"
	// Ponder OPTIONAL
	implementation("net.createmod.ponder:ponder-neoforge:${ponderVersion}+mc${minecraftVersion}")
	// PATCHOULI REQUIRED
	compileOnly "vazkii.patchouli:Patchouli:$patchouliVersion-NEOFORGE:api"
	runtimeOnly "vazkii.patchouli:Patchouli:$patchouliVersion-NEOFORGE"
	// ModKit DEV ONLY - datagen and nothing else. Keeping it off main's classpath is the point of

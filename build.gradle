dependencies {
	// JEI OPTIONAL
	compileOnly "mezz.jei:jei-$minecraftVersion-neoforge-api:$jeiVersion"
	runtimeOnly "mezz.jei:jei-$minecraftVersion-neoforge:$jeiVersion"
	// KubeJS OPTIONAL
	implementation "dev.architectury:architectury-neoforge:${architecturyVersion}"
	implementation "dev.latvian.mods:rhino:${rhinoVersion}"
	implementation "dev.latvian.mods:kubejs-neoforge:${kubejsVersion}"
	// Curios Optional
	implementation "top.theillusivec4.curios:curios-neoforge:${curiosVersion}+${minecraftVersion}"
	// Ponder OPTIONAL
	implementation("net.createmod.ponder:ponder-neoforge:${ponderVersion}+mc${minecraftVersion}")
	// PATCHOULI REQUIRED
	compileOnly "vazkii.patchouli:Patchouli:$patchouliVersion-NEOFORGE:api"
	runtimeOnly "vazkii.patchouli:Patchouli:$patchouliVersion-NEOFORGE"
	// ModKit DEV ONLY - datagen and nothing else. Keeping it off main's classpath is the point of
	// the datagen source set; see the sourceSets block above
	modkit 'com.github.thedarkcolour:ModKit:51b8760'

	// two GameTests build their expected species maps from the datagen providers
	testImplementation sourceSets.datagen.output
	// GameTests exercise every jar
	contentModules.each { testImplementation sourceSets[it].output }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
	var replaceProperties = [
			'version'              : project.version,
			'forgeVersionRange'    : forgeVersionRange,
			'jeiVersionRange'      : jeiVersionRange,
			'patchouliVersionRange': patchouliVersionRange,
			'fmlVersionRange'      : fmlVersionRange,
	]
	inputs.properties replaceProperties
	expand replaceProperties

	from 'src/main/templates'
	into 'build/generated/sources/modMetadata'
}

// Helper function to extract JSON entries while preserving duplicate keys
static def extractJsonEntries(File jsonFile) {
	def entries = []
	def lines = jsonFile.readLines()
	def slurper = new JsonSlurper()

	lines.each { line ->
		// Match lines like: "key": "value" or "key": value
		def matcher = line =~ /^\s*"([^"]+)"\s*:\s*(.+?)\s*,?\s*$/
		if (matcher.find()) {
			def key = matcher.group(1)
			def valueStr = matcher.group(2)

			// Remove trailing comma if present
			if (valueStr.endsWith(',')) {
				valueStr = valueStr.substring(0, valueStr.length() - 1).trim()
			}

			// Parse the value properly
			def value
			try {
				value = slurper.parseText(valueStr)
			} catch (Exception e) {
				// If parsing fails, keep as string (shouldn't happen for valid JSON)
				value = valueStr.replaceAll('^"|"$', '')
			}

			entries.add([key: key, value: value])
		}
	}

	return entries
}

// merge generated JSON into main JSON
var generateEnUsLang = tasks.register('generateEnUsLang', DefaultTask) {
	var manualFile = project.file('src/main/resources/assets/forestry/lang/en_us.json')
	var generatedFile = project.file('src/generated/resources/assets/forestry/lang/en_us.json')
	var mergedFile = project.file('build/generated/sources/mergedAssets/assets/forestry/lang/en_us.json')

	inputs.file(manualFile)
	inputs.file(generatedFile).skipWhenEmpty(true)
	outputs.file(mergedFile)

	doLast {
		mergedFile.parentFile.mkdirs()

		if (manualFile.exists() && generatedFile.exists()) {
			// Read main file and extract all entries (including duplicate _comment fields)
			def mainEntries = extractJsonEntries(manualFile)
			def generatedEntries = extractJsonEntries(generatedFile)

			// Track which non-comment keys we've already seen
			def seenKeys = new HashSet()
			mainEntries.each { entry ->
				if (entry.key != "_comment") {
					seenKeys.add(entry.key)
				}
			}

			// Filter generated entries to only include new keys (but keep all _comment fields)
			def filteredGeneratedEntries = generatedEntries.findAll { entry ->
				entry.key == "_comment" || !seenKeys.contains(entry.key)
			}

			// Combine: main entries first, then new generated entries
			def allEntries = mainEntries + filteredGeneratedEntries

			// Write JSON using JsonOutput for proper formatting
			def lines = allEntries.collect { entry ->
				"  ${JsonOutput.toJson(entry.key)}: ${JsonOutput.toJson(entry.value)}"
			}

			mergedFile.text = "{\n${lines.join(',\n')}\n}"
		} else if (manualFile.exists()) {
			copy {
				from manualFile
				into mergedFile.parentFile
			}
		} else if (generatedFile.exists()) {
			copy {
				from generatedFile
				into mergedFile.parentFile
			}
		}
	}
}

tasks.named('processResources', ProcessResources) {
	dependsOn(generateEnUsLang)

	exclude 'assets/forestry/lang/check_translations.py'

	filesMatching('assets/forestry/lang/en_us.json') { fileCopyDetails ->
		def file = fileCopyDetails.file
		if (!file.absolutePath.contains('mergedAssets')) {
			fileCopyDetails.exclude()
		}
	}
}

sourceSets.main {
	resources {
		srcDir 'src/generated/resources'
		srcDir 'build/generated/sources/mergedAssets'
		srcDir generateModMetadata
	}
}

neoForge.ideSyncTask generateModMetadata

jar {
	from sourceSets.main.output.classesDirs
	from sourceSets.main.output.resourcesDir
	// 9a keeps one artifact: the five content source sets compile separately but ship together, so
	// the jar's contents are unchanged. 9b gives each its own jar task and mod id.
	// Take the whole SourceSetOutput rather than its classesDirs and resourcesDir separately - only
	// the former carries the builtBy wiring, and without it Gradle fails the build on an undeclared
	// dependency from jar to processAgricultureResources
	contentModules.each { from sourceSets[it].output }

	manifest {
		attributes([
				'Specification-Title'     : 'Forestry',
				'Specification-Vendor'    : 'SirSengir',
				'Specification-Version'   : "${project.version}",
				'Implementation-Title'    : "${project.name}",
				'Implementation-Version'  : "${project.version}",
				'Implementation-Vendor'   : 'SirSengir',
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xmaxerrs' << '400'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

javadoc {
	source = sourceSets.main.allJava
	classpath = sourceSets.main.compileClasspath + sourceSets.main.output

	options.addStringOption('Xdoclint:none', '-quiet')
	options.encoding = 'UTF-8'

	include 'forestry/api/**'
}

tasks.register('javadocJar', Jar) {
	dependsOn javadoc
	archiveClassifier.set('javadoc')
	from javadoc.destinationDir
}

tasks.register('sourcesJar', Jar) {
	archiveClassifier.set('sources')
	from sourceSets.main.allJava
}

tasks.register('apiJar', Jar) {
	archiveClassifier.set('api')
	// api jar ist just a development aid and serves as both a binary and source jar simultaneously
	from sourceSets.main.output
	from sourceSets.main.allJava

	include 'forestry/api/**'
}

tasks.named('assemble') {
	dependsOn javadocJar
	dependsOn sourcesJar
	dependsOn apiJar
}

publishing {
	afterEvaluate {
		publications {
			mavenJava(MavenPublication) {
				groupId = project.group
				artifactId = project.base.archivesName.get()
				version = project.version

				// ForgeGradle will generate wild dependency definitions, see https://github.com/MinecraftForge/ForgeGradle/issues/584
				// Since we don't actually depend on anything, just remove the entire node.
				pom.withXml {
					asNode().remove(asNode().dependencies)
				}

				from components.java
				artifact sourcesJar
				artifact javadocJar
				artifact apiJar
			}
		}
	}

	repositories {
		maven {
			def releasesRepoUrl = uri(layout.buildDirectory.dir('repos/releases'))
			def snapshotsRepoUrl = uri(layout.buildDirectory.dir('repos/snapshots'))

			name = 'Project'
			url = version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
		}

		maven {
			credentials {
				username = System.getenv('MODMAVEN_USER')
				password = System.getenv('MODMAVEN_PASSWORD')
			}

			name = 'Modmaven'
			url = 'https://modmaven.dev/artifactory/local-releases/'
		}
	}
}

if (System.getenv('CURSEFORGE_TOKEN')) {
	curseforge {
		apiKey = System.getenv('CURSEFORGE_TOKEN')

		project {
			id = project.curseforgeId
			changelogType = 'markdown'
			changelog = getChangelog(version)

			releaseType = 'release'

			addGameVersion(project.minecraftVersion)
			addGameVersion('Forge')
			addGameVersion('Java 17')

			mainArtifact(jar.archiveFile) {
				displayName = "Forestry: Community Edition ${project.version}"
				relations {
					optionalDependency 'jei'
					requiredDependency 'patchouli'
				}
			}
		}
	}
}

modrinth {
	token = System.getenv('MODRINTH_TOKEN')
	projectId = project.modrinthId
	versionName = "Forestry: Community Edition $version"
	versionNumber = version.toString()
	versionType = 'release'
	gameVersions = [minecraftVersion]
	loaders = ['forge']
	changelog = getChangelog(project.version)

	uploadFile = jar
	additionalFiles.add(sourcesJar)
	additionalFiles.add(apiJar)
	additionalFiles.add(javadocJar)

	dependencies {
		optional.project('jei')
		required.project('patchouli')
	}
}

static def getChangelog(Object version) {
	version = version.toString()

	def file = new File('changelog.md')
	if (!file.exists()) {
		return 'Changelog file not found'
	}

	// Relies on the changelog block being "##blahblahblah_VERSION" where _ is a space
	def content = file.text.normalize().split("##.* ")

	for (final def chunk in content) {
		if (chunk.isEmpty()) continue

		def lineTerminatorIndex = chunk.findIndexOf { c -> c == '\n' || c == '\r' }
		def versionString = chunk.substring(0, lineTerminatorIndex)

		if (versionString == version) {
			return "## Forestry $version\n" + chunk.substring(lineTerminatorIndex + 1)
		}
	}

	// Fallback in case this fails
	return "Forestry Update ${version}"
}

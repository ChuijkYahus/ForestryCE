// A boot configuration proves what loads. It cannot prove what shipped: base once went out with no
// en_us and no global_loot_modifiers.json and every boot still reached Done, because a missing loot
// modifier list is not an error and a headless server never renders a lang key. This reads the built
// jars instead, and it is the cheaper of the two checks.
var checkJarPartition = tasks.register('checkJarPartition') {
	group = 'verification'
	description = 'Fails if a jar carries another jar\'s classes or is missing its share of a split file'

	dependsOn tasks.named('jar')
	contentModules.each { dependsOn contentJars[it] }
	dependsOn(partitionSharedResources)
	outputs.upToDateWhen { false }

	doLast {
		var problems = new ArrayList<String>()
		var jarFiles = ['core': tasks.named('jar').get().archiveFile.get().asFile]
		contentModules.each { m -> jarFiles[m] = contentJars[m].get().archiveFile.get().asFile }

		var entriesOf = { File jar ->
			var names = new HashSet<String>()
			new java.util.zip.ZipFile(jar).withCloseable { zip ->
				zip.entries().each { names.add(it.name) }
			}
			return names
		}
		var entries = jarFiles.collectEntries { jar, file -> [(jar): entriesOf(file)] }

		// No jar may carry another's package tree. The compiler enforces this for the source sets;
		// this is the same statement about the artifact
		contentModules.each { m ->
			var foreign = entries[m].findAll { it.endsWith('.class') && !it.startsWith("forestry/${contentPackages[m]}/") }
			if (!foreign.isEmpty()) {
				problems.add("forestry_${m} carries ${foreign.size()} class(es) it does not own, first: ${foreign.first()}")
			}
		}
		var contentInCore = entries['core'].findAll { name ->
			name.endsWith('.class') && contentModules.any { name.startsWith("forestry/${contentPackages[it]}/") }
		}
		if (!contentInCore.isEmpty()) {
			problems.add("the base jar carries ${contentInCore.size()} content class(es), first: ${contentInCore.first()}")
		}

		// The game reads a .mcmeta from the pack that supplied the file it annotates, so one that ships
		// in another jar is silently ignored. An animated texture then renders as the whole frame strip
		var jarOf = new HashMap<String, String>()
		entries.each { jar, names -> names.each { jarOf[it] = jar } }
		entries.each { jar, names ->
			names.findAll { it.endsWith('.mcmeta') }.each { name ->
				var principal = name.substring(0, name.length() - '.mcmeta'.length())
				var owner = jarOf[principal]
				if (owner != null && owner != jar) {
					problems.add("${jar} ships ${name} but ${principal} ships in ${owner}")
				}
			}
		}

		// Every variant the partition wrote has to reach the jar it was written for
		var outDir = partitionDir.get().asFile
		var written = 0
		jarFiles.keySet().each { jar ->
			var jarDir = new File(outDir, jar)
			if (!jarDir.exists()) {
				return
			}
			jarDir.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
				written++
				var rel = jarDir.toPath().relativize(file.toPath()).toString()
				if (!entries[jar].contains(rel)) {
					problems.add("${jar} is missing its share of ${rel}")
				}
			}
		}

		if (!problems.isEmpty()) {
			throw new GradleException("Jar partition is wrong:\n  " + problems.join('\n  '))
		}
		logger.lifecycle("checkJarPartition: ${jarFiles.size()} jars, no foreign classes, ${written} split variant(s) all present")
	}
}


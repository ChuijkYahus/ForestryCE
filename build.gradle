// Every jar ships only the resources the ownership map assigns to it. Unmapped paths - the mod
// metadata, the access transformer, pack.mcmeta, the logo - fall to core, which is always installed.
var resourceOwnerOf = { String path ->
	if (!resourceOwnersFile.exists()) {
		return 'core'
	}
	return (project.ext.has('resourceOwnerMap')
			? project.ext.resourceOwnerMap
			: (project.ext.resourceOwnerMap = new JsonSlurper().parse(resourceOwnersFile) as Map<String, String>))
			.getOrDefault(path, 'core')
}

jar {
	// The java plugin already puts sourceSets.main.output in this jar, so this filters rather than
	// adds. Class files are not in the ownership map and default to core, which is correct: main's
	// classes are the core jar
	exclude { it.directory ? false : resourceOwnerOf(it.relativePath.pathString) != 'core' }

	manifest {
		attributes([
				'Specification-Title'     : 'Forestry',
				'Specification-Vendor'    : 'SirSengir',
				'Specification-Version'   : "${project.version}",
				'Implementation-Title'    : "${project.name}",
				'Implementation-Version'  : "${project.version}",
				'Implementation-Vendor'   : 'SirSengir',
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

var contentJars = contentModules.collectEntries { m ->
	[(m): tasks.register("${m}Jar", Jar) {
		group = 'build'
		description = "Assembles the forestry_${m} jar"
		archiveBaseName.set("forestry_${m}-${minecraftVersion}")

		// the module's own classes, its mods.toml and its service file
		from sourceSets[m].output
		// plus its share of the shared resource trees
		from(sourceSets.main.output.resourcesDir) {
			include { it.directory || resourceOwnerOf(it.relativePath.pathString) == m }
		}

		manifest {
			attributes([
					'Specification-Title'     : "Forestry: ${m.capitalize()}",
					'Specification-Vendor'    : 'SirSengir',
					'Specification-Version'   : "${project.version}",
					'Implementation-Title'    : "forestry_${m}",
					'Implementation-Version'  : "${project.version}",
					'Implementation-Vendor'   : 'SirSengir',
					'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
			])
		}
	}]
}

tasks.named('assemble') {
